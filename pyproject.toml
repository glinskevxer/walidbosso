[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "binyard"
version = "0.1.0"
description = "Receiving, grading, storage obligation and load-out accounting for a country grain elevator"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer", email = "roym78109@gmail.com" }]
dependencies = []

[project.optional-dependencies]
api = [
    "starlette==0.41.3",
    "uvicorn==0.34.0",
]
serve = [
    "gunicorn==23.0.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.123.2",
    "freezegun==1.5.1",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

[project.scripts]
binyard = "binyard.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/binyard"]

[tool.hatch.build.targets.wheel.force-include]
"src/binyard/py.typed" = "binyard/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
