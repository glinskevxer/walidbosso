[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "binyard"
version = "0.1.0"
description = "Receiving, grading, storage obligation and load-out accounting for a country grain elevator"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer", email = "roym78109@gmail.com" }]
dependencies = []

[project.optional-dependencies]
api = [
    "starlette==0.41.3",
    "uvicorn==0.34.0",
]
serve = [
    "gunicorn==23.0.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.123.2",
    "freezegun==1.5.1",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

[project.scripts]
binyard = "binyard.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/binyard"]

[tool.hatch.build.targets.wheel.force-include]
"src/binyard/py.typed" = "binyard/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Every default built by a call here is a frozen value object: Percent.zero(),
    # Bushels.zero(), Price.zero(). Sharing one instance across every dataclass
    # that defaults to it is correct and intended, and the rule exists for
    # mutable defaults, which this package does not have.
    "RUF009",
]

[tool.ruff.lint.per-file-ignores]
# Test modules import their own factories from conftest, which sits beside them
# rather than on the package path, and assert on things a linter reads as unused.
"tests/*" = ["E402"]
# The seeder inserts src on the path before importing the package it seeds.
"scripts/seed_demo.py" = ["E402"]
