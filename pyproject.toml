[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "binyard"
version = "0.1.0"
description = "Receiving, grading, storage obligation and load-out accounting for a country grain elevator"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer", email = "roym78109@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/binyard"]

[tool.hatch.build.targets.wheel.force-include]
"src/binyard/py.typed" = "binyard/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
