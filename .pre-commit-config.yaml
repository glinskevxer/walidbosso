# Everything here also runs in CI. The hooks exist so a mistake is caught in
# the two seconds before a commit rather than the four minutes after a push.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        files: ^(src|tests|scripts)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^src/binyard/
        additional_dependencies: [starlette==0.41.3]

  - repo: local
    hooks:
      - id: check-tests
        name: no focused or assertion free tests
        entry: python scripts/check_tests.py
        language: system
        pass_filenames: false
        files: ^tests/

      - id: check-pins
        name: exact pins, and a lock that agrees
        entry: python scripts/check_pins.py
        language: system
        pass_filenames: false
        files: ^(pyproject.toml|constraints.txt)$

      - id: no-real-money-in-floats
        name: no float arithmetic on money or bushels
        entry: python scripts/check_no_floats.py
        language: system
        pass_filenames: false
        files: ^src/binyard/
