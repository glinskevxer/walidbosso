name: security

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/security.yml
  schedule:
    # Monday morning, before anybody is in.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install -c constraints.txt -e ".[api,serve,dev]"
          pip install pip-audit==2.7.3
      # Two things are going on here and they are worth keeping apart.
      #
      # --skip-editable, and not --strict: binyard is installed with -e and is
      # not on PyPI, so pip-audit has nothing to look it up against. Without
      # the skip it fails on the one package that has no advisories to find.
      #
      # The --ignore-vuln list is the real decision. This package pins early
      # 2025 versions on purpose, and advisories published since then land
      # against those pins. Each one is accepted **by id**, which is the point:
      # a new advisory against any dependency still fails this job. A blanket
      # suppression, or dropping the audit, would not.
      #
      # What is actually exposed:
      #   starlette 0.41.3 — seven advisories, and starlette ships in the api
      #     extra, so these are live for a deployment. Clearing them means
      #     starlette 1.x, which is a different framework generation and a
      #     deliberate departure from the early 2025 pin set.
      #   pytest 8.3.4 — one advisory, dev only. It never reaches a runtime.
      #
      # Revisit when the pin set is next moved forward. Until then this list is
      # the honest record of what is being carried.
      - name: audit
        run: |
          pip-audit --skip-editable --progress-spinner off \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-1845

  secrets:
    name: nothing that looks like a key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep the tree
        run: |
          set -e
          # The package never reads a key from a literal, so anything matching
          # here is either a test fixture with an obvious name or a mistake.
          if grep -rInE '(api[_-]?key|secret|password|token)[[:space:]]*=[[:space:]]*"[A-Za-z0-9/+=_-]{16,}"' \
             --include='*.py' --include='*.toml' --include='*.yml' \
             src scripts pyproject.toml; then
            echo "that looks like a credential in the tree"
            exit 1
          fi
          echo "clean"

      - name: the settings dump never carries the key
        run: |
          grep -q 'Everything except the key' src/binyard/config.py
          ! grep -n '"api_key"' src/binyard/config.py
